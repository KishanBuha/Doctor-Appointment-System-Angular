<div class="minimal-bg min-vh-100 d-flex align-items-center justify-content-center p-3">
    <div class="card login-card border-0 shadow-lg rounded-4 overflow-hidden" style="max-width: 450px; width: 100%;">
        <div class="card-body p-5">
            
            <div class="text-center mb-5">
                <div class="bg-primary bg-opacity-10 text-primary d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 70px; height: 70px;">
                    <i class="bi bi-heart-pulse-fill" style="font-size: 2.5rem;"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Doctor Join</h3>
                <p class="text-muted small">Expand your practice with Global Hospital</p>
            </div>

            <form (ngSubmit)="registerDoctor()">
                
                <div class="form-floating mb-3 custom-floating">
                    <input type="text" class="form-control fw-semibold" id="nameInput" [(ngModel)]="name" name="name" placeholder="Dr. Name" required>
                    <label for="nameInput"><i class="bi bi-person me-2"></i>Full Name</label>
                </div>

                <div class="form-floating mb-3 custom-floating">
                    <select class="form-select fw-semibold" id="specSelect" [(ngModel)]="speciality" name="speciality" required>
                        <option value="" disabled selected></option> <option *ngFor="let spec of specializations" [value]="spec">{{ spec }}</option>
                    </select>
                    <label for="specSelect"><i class="bi bi-award me-2"></i>Specialization</label>
                </div>

                <div class="form-floating mb-3 custom-floating">
                    <input type="number" class="form-control fw-semibold" id="expInput" [(ngModel)]="experience" name="experience" placeholder="Years" required>
                    <label for="expInput"><i class="bi bi-briefcase me-2"></i>Experience (Years)</label>
                </div>

                <div class="form-floating mb-3 custom-floating">
                    <input type="email" class="form-control fw-semibold" id="emailInput" [(ngModel)]="email" name="email" placeholder="name@example.com" required>
                    <label for="emailInput"><i class="bi bi-envelope me-2"></i>Email Address</label>
                </div>
                
                <div class="form-floating mb-4 custom-floating">
                    <input type="password" class="form-control fw-semibold" id="passwordInput" [(ngModel)]="password" name="password" placeholder="Password" required>
                    <label for="passwordInput"><i class="bi bi-key me-2"></i>Password</label>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-bold fs-6 login-btn mb-4">
                    Register Now
                </button>
            </form>

            <div class="d-flex justify-content-center align-items-center gap-3 pt-3 border-top border-light">
                <a routerLink="/doctor-login" class="text-decoration-none small text-muted fw-semibold hover-primary">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Already have an account? Login
                </a>
            </div>
            
        </div>
    </div>
</div>
