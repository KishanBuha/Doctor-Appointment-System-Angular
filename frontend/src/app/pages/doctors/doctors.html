<div class="page-header text-center">
    <div class="container">
        <h2 class="fw-bold text-dark mb-2">Find Your Specialist</h2>
        <p class="text-muted mb-4">Book appointments with top-rated doctors.</p>
        
        <div class="search-container">
            <i class="bi bi-search search-icon"></i>
            <input type="text" class="search-input" 
                   placeholder="Search by doctor name or speciality..." 
                   [(ngModel)]="searchQuery" 
                   (keyup)="filterDoctors()">
        </div>
    </div>
</div>

<div class="container pb-5">
    
    <div class="d-flex gap-2 mb-4 overflow-auto pb-2 justify-content-center">
        <button class="btn btn-sm rounded-pill px-3 fw-bold" 
                [class.btn-dark]="selectedSpeciality === 'All'"
                [class.btn-light]="selectedSpeciality !== 'All'"
                (click)="filterBySpeciality('All')">All</button>
        
        <button class="btn btn-sm rounded-pill px-3 fw-bold" 
                [class.btn-dark]="selectedSpeciality === 'General Physician'"
                [class.btn-light]="selectedSpeciality !== 'General Physician'"
                (click)="filterBySpeciality('General Physician')">General Physician</button>

        <button class="btn btn-sm rounded-pill px-3 fw-bold" 
                [class.btn-dark]="selectedSpeciality === 'Gynecologist'"
                [class.btn-light]="selectedSpeciality !== 'Gynecologist'"
                (click)="filterBySpeciality('Gynecologist')">Gynecologist</button>

        <button class="btn btn-sm rounded-pill px-3 fw-bold" 
                [class.btn-dark]="selectedSpeciality === 'Dermatologist'"
                [class.btn-light]="selectedSpeciality !== 'Dermatologist'"
                (click)="filterBySpeciality('Dermatologist')">Dermatologist</button>

        <button class="btn btn-sm rounded-pill px-3 fw-bold" 
                [class.btn-dark]="selectedSpeciality === 'Pediatricians'"
                [class.btn-light]="selectedSpeciality !== 'Pediatricians'"
                (click)="filterBySpeciality('Pediatricians')">Pediatricians</button>

        <button class="btn btn-sm rounded-pill px-3 fw-bold" 
                [class.btn-dark]="selectedSpeciality === 'Neurologist'"
                [class.btn-light]="selectedSpeciality !== 'Neurologist'"
                (click)="filterBySpeciality('Neurologist')">Neurologist</button>
    </div>

    <div class="row g-4">
        <div class="col-sm-6 col-lg-3" *ngFor="let doc of filteredDoctors">
            <div class="doctor-card shadow-sm cursor-pointer" (click)="bookAppointment(doc)">
                
                <div class="card-img-wrapper">
                    <img [src]="doc.image || 'assets/default-doctor.png'" class="doctor-img">
                    <div class="status-indicator" *ngIf="doc.available">
                        <i class="bi bi-circle-fill" style="font-size: 6px;"></i> Available
                    </div>
                </div>

                <div class="card-body">
                    <span class="speciality-badge">{{ doc.speciality }}</span>
                    <h5 class="fw-bold text-dark mb-1">Dr. {{ doc.name }}</h5>
                    <p class="text-muted small mb-3">{{ doc.degree }} • {{ doc.experience }} Years Exp.</p>
                    
                    <button class="btn-book">
                        Book Appointment <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </div>

            </div>
        </div>

        <div class="col-12 text-center py-5" *ngIf="filteredDoctors.length === 0">
            <div class="opacity-50 mb-3">
                <i class="bi bi-search display-1 text-secondary"></i>
            </div>
            <h5 class="fw-bold text-muted">No doctors found</h5>
            <p class="text-muted small">Try adjusting your search filters.</p>
        </div>
    </div>
</div>
